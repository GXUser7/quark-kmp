name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew jvmTest --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Errors
        if: failure()
        run: grep -E "^e: |^w: .*error|What went wrong|FAILED|> " -A2 build.log | head -150
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.QUARK_KEYSTORE_BASE64 }}
      QUARK_KEYSTORE_PASSWORD: ${{ secrets.QUARK_KEYSTORE_PASSWORD }}
      QUARK_KEY_ALIAS: ${{ secrets.QUARK_KEY_ALIAS }}
      QUARK_KEY_PASSWORD: ${{ secrets.QUARK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without these secrets the release APK is signed with the debug key:
      # installable, but a later build signed differently cannot update it.
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quark.jks"
          echo "QUARK_KEYSTORE_FILE=$RUNNER_TEMP/quark.jks" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Errors
        if: failure()
        run: grep -E "^e: |ERROR:|What went wrong|Missing class|> " -A2 build.log | head -150
      - name: Collect
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/*.apk dist/quark-android.apk
          cp androidApp/build/outputs/apk/debug/*.apk dist/quark-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quark-android
          path: dist/*.apk

  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew :app:packageMsi :app:packageExe :app:createDistributable 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Errors
        if: failure()
        run: grep -E "^e: |ERROR:|What went wrong|> " -A2 build.log | head -150
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item app/build/compose/binaries/main/msi/*.msi dist/quark-windows-x64.msi
          Copy-Item app/build/compose/binaries/main/exe/*.exe dist/quark-windows-x64-setup.exe
          Compress-Archive -Path app/build/compose/binaries/main/app/quark -DestinationPath dist/quark-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: quark-windows
          path: dist/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, android, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
