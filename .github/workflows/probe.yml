name: probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/workflows/probe.yml" ]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Versions on Google Maven
        run: |
          for a in com/android/tools/build/gradle androidx/media3/media3-exoplayer androidx/media3/media3-session androidx/media3/media3-datasource-okhttp androidx/activity/activity-compose androidx/core/core-ktx androidx/documentfile/documentfile androidx/lifecycle/lifecycle-process androidx/compose/material/material-icons-extended; do
            echo "== $a"; curl -s "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | tr '<' '\n' | grep -E '^version>' | sed 's/version>//' | tail -12 | tr '\n' ' '; echo
          done
      - name: Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"; java -version 2>&1
  windows:
    runs-on: windows-2022
    steps:
      - name: WiX and Java
        shell: bash
        run: |
          ls "/c/Program Files (x86)" | grep -i wix || true
          where candle.exe light.exe || true
          java -version 2>&1; echo "JAVA_HOME_21_X64=$JAVA_HOME_21_X64"
