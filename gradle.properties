org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Maven Central drops the JDK's TLS 1.3 ClientHello from this network ("Remote host
# terminated the handshake") while curl to the same url succeeds. Pinning 1.2 is what
# makes dependency resolution work here; drop it if the build ever runs elsewhere.
systemProp.https.protocols=TLSv1.2
